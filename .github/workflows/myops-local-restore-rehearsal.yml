name: MYOPS local restore rehearsal

on:
  workflow_dispatch:
    inputs:
      restore_target:
        description: Fixed disposable localhost target (no other destination is accepted).
        required: true
        type: choice
        options:
          - postgresql://127.0.0.1:5432/restore_rehearsal
      artifact_run_id:
        description: Existing run in this private repository that holds the owner-approved protected backup artifact.
        required: true
        type: string
      backup_artifact_name:
        description: Exact artifact name from that run; artifact must contain only backup-manifest.json and one supported dump.
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the exact backup-manifest.json, verified out-of-band by the owner.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  local-restore-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RESTORE_TARGET_INPUT: ${{ inputs.restore_target }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      BACKUP_ARTIFACT_NAME: ${{ inputs.backup_artifact_name }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require PostgreSQL client tools
        id: client
        shell: bash
        run: |
          set -euo pipefail
          pg_isready --version >/dev/null
          node scripts/local-restore-rehearsal-guard.mjs clients

      - name: Validate private-repository artifact and local target
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != */* ]] || ! [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'BLOCKED: malformed repository or artifact run ID.'
            exit 1
          fi
          if ! [[ "$MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'BLOCKED: an independently verified manifest SHA-256 is required.'
            exit 1
          fi
          if [[ -z "$BACKUP_ARTIFACT_NAME" || "$BACKUP_ARTIFACT_NAME" == *$'\n'* ]]; then
            echo 'BLOCKED: an exact artifact name is required.'
            exit 1
          fi
          node scripts/local-restore-rehearsal-guard.mjs target "$RESTORE_TARGET_INPUT"
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')" != true ]]; then
            echo 'BLOCKED: backup artifacts are accepted only from a private repository.'
            exit 1
          fi
          for name in SUPABASE_URL NEXT_PUBLIC_SUPABASE_URL VITE_SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY MYOPS_SERVICE_ROLE_KEY \
            MYOPS_SESSION_SECRET DATABASE_URL SUPABASE_DB_URL SUPABASE_DATABASE_URL \
            POSTGRES_URL POSTGRES_PASSWORD PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE; do
            if [[ -n "${!name:-}" ]]; then
              echo "BLOCKED: remote endpoint or database secret ${name} is present."
              exit 1
            fi
          done
          echo 'PREFLIGHT=passed'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download explicitly approved private artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.backup_artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/restore-artifact

      - name: Inspect artifact layout without logging file names
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-restore-rehearsal-guard.mjs inspect "${RUNNER_TEMP}/restore-artifact"

      - name: Validate dump integrity and source manifest
        id: manifest
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          manifest="${{ steps.inspect.outputs.manifest }}"
          dump="${{ steps.inspect.outputs.dump }}"
          format="${{ steps.inspect.outputs.format }}"
          echo "::add-mask::$manifest"
          echo "::add-mask::$dump"
          node scripts/local-restore-rehearsal-guard.mjs manifest \
            "$manifest" "$dump" "$format" "$EXPECTED_MANIFEST_SHA256"
          echo 'MANIFEST=verified'

      - name: Start disposable PostgreSQL bound to loopback
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --name myops-local-restore --detach \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=restore_rehearsal \
            -p 127.0.0.1:5432:5432 \
            postgres:16-alpine >/dev/null
          for attempt in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null
          echo 'LOCAL_POSTGRES=ready'

      - name: Restore using the matching pg_dump reader
        id: restore
        shell: bash
        env:
          DUMP_FILE: ${{ steps.inspect.outputs.dump }}
          DUMP_FORMAT: ${{ steps.inspect.outputs.format }}
        run: |
          set -euo pipefail
          if ! {
            case "$DUMP_FORMAT" in
              plain)
                psql --no-psqlrc --set=ON_ERROR_STOP=1 "$RESTORE_TARGET" < "$DUMP_FILE"
                ;;
              gzip-sql)
                gzip -dc -- "$DUMP_FILE" | psql --no-psqlrc --set=ON_ERROR_STOP=1 "$RESTORE_TARGET"
                ;;
              custom|tar)
                pg_restore --exit-on-error --no-owner --no-privileges \
                  --dbname="$RESTORE_TARGET" "$DUMP_FILE"
                ;;
              *)
                exit 1
                ;;
            esac
          } >"${RUNNER_TEMP}/restore-output.log" 2>&1; then
            rm -f "${RUNNER_TEMP}/restore-output.log"
            echo 'BLOCKED_OR_FAILED: restore failed; details withheld.'
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/restore-output.log"
          echo 'RESTORE=completed'

      - name: Compare restored database to the verified source manifest
        id: compare
        shell: bash
        env:
          MANIFEST_FILE: ${{ steps.inspect.outputs.manifest }}
        run: |
          set -euo pipefail
          node scripts/local-restore-rehearsal-guard.mjs compare "$MANIFEST_FILE"

      - name: Clean up disposable database
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps -aq --filter name='^/myops-local-restore$')"
          if [[ -n "$container" ]]; then
            docker rm -f "$container" >/dev/null
          fi
          rm -rf "${RUNNER_TEMP}/restore-artifact" \
            "${RUNNER_TEMP}/restore-backup-manifest.json" \
            "${RUNNER_TEMP}"/restore-backup.* \
            "${RUNNER_TEMP}/restore-output.log"
          echo 'CLEANUP=completed'

      - name: Report actual rehearsal outcome
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          POSTGRES_OUTCOME: ${{ steps.postgres.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          result="$(node scripts/local-restore-rehearsal-guard.mjs result \
            "$CLIENT_OUTCOME" "$PREFLIGHT_OUTCOME" "$DOWNLOAD_OUTCOME" "$INSPECT_OUTCOME" "$MANIFEST_OUTCOME" \
            "$POSTGRES_OUTCOME" "$RESTORE_OUTCOME" "$COMPARE_OUTCOME" "$CLEANUP_OUTCOME")"
          echo "REHEARSAL_RESULT=${result}"

name: MYOPS synthetic local restore rehearsal

on:
  workflow_dispatch:
    inputs:
      restore_target:
        description: Fixed loopback-only destination for synthetic test data.
        required: true
        type: choice
        options:
          - postgresql://127.0.0.1:5432/restore_rehearsal

permissions:
  contents: read

jobs:
  synthetic-local-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RESTORE_TARGET_INPUT: ${{ inputs.restore_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 16 client
        id: client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install --yes postgresql-client-16 >/dev/null
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/psql --version >/dev/null
          /usr/lib/postgresql/16/bin/pg_restore --version >/dev/null

      - name: Validate exact loopback destination
        id: target
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-restore-rehearsal-guard.mjs target "$RESTORE_TARGET_INPUT"

      - name: Generate synthetic fixture and manifest
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-restore-rehearsal-guard.mjs fixture

      - name: Validate synthetic fixture checksums and manifest
        id: manifest
        shell: bash
        env:
          FIXTURE_MANIFEST: ${{ steps.fixture.outputs.manifest }}
          FIXTURE_DUMP: ${{ steps.fixture.outputs.dump }}
          FIXTURE_MANIFEST_HASH: ${{ steps.fixture.outputs.manifest_hash }}
        run: |
          set -euo pipefail
          node scripts/local-restore-rehearsal-guard.mjs manifest \
            "$FIXTURE_MANIFEST" "$FIXTURE_DUMP" "$FIXTURE_MANIFEST_HASH"

      - name: Start disposable PostgreSQL bound to loopback
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --name myops-synthetic-restore --detach \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=restore_rehearsal \
            -p 127.0.0.1:5432:5432 \
            postgres:16-alpine >/dev/null
          for attempt in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null

      - name: Restore only the generated synthetic SQL fixture
        id: restore
        shell: bash
        env:
          FIXTURE_DUMP: ${{ steps.fixture.outputs.dump }}
        run: |
          set -euo pipefail
          if ! psql --no-psqlrc --set=ON_ERROR_STOP=1 "$RESTORE_TARGET" \
              < "$FIXTURE_DUMP" >"${RUNNER_TEMP}/synthetic-restore.log" 2>&1; then
            rm -f "${RUNNER_TEMP}/synthetic-restore.log"
            echo 'SYNTHETIC_RESTORE_FAILED: diagnostic output withheld.'
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/synthetic-restore.log"
          echo 'SYNTHETIC_SQL_RESTORED=true'

      - name: Compare all synthetic manifest assertions
        id: compare
        shell: bash
        env:
          FIXTURE_MANIFEST: ${{ steps.fixture.outputs.manifest }}
        run: |
          set -euo pipefail
          node scripts/local-restore-rehearsal-guard.mjs compare "$FIXTURE_MANIFEST"

      - name: Remove disposable database and fixture
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps -aq --filter name='^/myops-synthetic-restore$')"
          if [[ -n "$container" ]]; then docker rm -f "$container" >/dev/null; fi
          rm -rf "${RUNNER_TEMP}/synthetic-fixture" "${RUNNER_TEMP}/synthetic-restore.log"
          echo 'SYNTHETIC_CLEANUP=completed'

      - name: Report actual synthetic rehearsal outcome
        id: result
        if: always()
        shell: bash
        env:
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          TARGET_OUTCOME: ${{ steps.target.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          POSTGRES_OUTCOME: ${{ steps.postgres.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          result="$(node scripts/local-restore-rehearsal-guard.mjs result \
            "$CLIENT_OUTCOME" "$TARGET_OUTCOME" "$FIXTURE_OUTCOME" "$MANIFEST_OUTCOME" \
            "$POSTGRES_OUTCOME" "$RESTORE_OUTCOME" "$COMPARE_OUTCOME" "$CLEANUP_OUTCOME")"
          echo "SYNTHETIC_REHEARSAL_RESULT=${result}"

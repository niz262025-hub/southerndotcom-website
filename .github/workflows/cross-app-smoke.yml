name: MYOPS cross-app staging smoke
on:
  push:
    branches: [fix/staging-qa-gates-20261111]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify MYOPS app entrypoints are reachable
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://www.myops.com.my/"
            "https://app.myops.com.my/"
            "https://opsflow.myops.com.my/"
            "https://opshr.myops.com.my/"
            "https://opshub.myops.com.my/"
            "https://southerndotcom-website-n8mbkbwf3-mohd-syaiful-nizam1.vercel.app/"
            "https://opsfinance-ecior985q-mohd-syaiful-nizam1.vercel.app/"
            "https://opsflow-staging-gzofesy26-mohd-syaiful-nizam1.vercel.app/"
            "https://opsp-mobile-r1-kegpw4g34-mohd-syaiful-nizam1.vercel.app/"
            "https://opshr-b5p8ig20m-mohd-syaiful-nizam1.vercel.app/"
          )
          failed=0
          for url in "${urls[@]}"; do
            status=$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' "$url") || status=000
            echo "$url -> HTTP $status"
            if [[ "$status" == "000" || "$status" == 5* || "$status" == 4* ]]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Chromium browser for staging UAT
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser UAT across six apps
        run: node tests/staging-browser-smoke.mjs
